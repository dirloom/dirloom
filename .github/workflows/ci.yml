name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install completion shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Test
        shell: bash
        run: go test -coverprofile=coverage.out ./...

      - name: Build
        run: go build -trimpath ./cmd/dirloom

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  diagram-syntax:
    name: Diagram syntax compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          dot -V

      - name: Install D2
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.7.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          d2 --version

      - name: Install Mermaid CLI
        run: |
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libcups2
          npm install --global @mermaid-js/mermaid-cli@11.12.0

      - name: Generate fixtures and validate official parsers
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/dirloom ./cmd/dirloom
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/src" "$fixture/empty"
          : > "$fixture/README.md"
          : > "$fixture/src/index.ts"
          generated="$(mktemp -d)"
          /tmp/dirloom "$fixture" --no-config --no-default-ignore --format mermaid --output "$generated/structure.mmd"
          /tmp/dirloom "$fixture" --no-config --no-default-ignore --format graphviz --output "$generated/structure.dot"
          /tmp/dirloom "$fixture" --no-config --no-default-ignore --format d2 --output "$generated/structure.d2"
          proof="$(mktemp -d)"
          mmdc -p .github/mermaid-puppeteer.json -i "$generated/structure.mmd" -o "$proof/structure-mermaid.svg"
          mmdc -p .github/mermaid-puppeteer.json -i internal/render/testdata/mermaid.golden -o "$proof/golden-mermaid.svg"
          dot -Tsvg "$generated/structure.dot" -o "$proof/structure-graphviz.svg"
          dot -Tsvg internal/render/testdata/graphviz.golden -o "$proof/golden-graphviz.svg"
          d2 "$generated/structure.d2" "$proof/structure-d2.svg"
          d2 internal/render/testdata/d2.golden "$proof/golden-d2.svg"
          test -s "$proof/structure-mermaid.svg"
          test -s "$proof/golden-mermaid.svg"
          test -s "$proof/structure-graphviz.svg"
          test -s "$proof/golden-graphviz.svg"
          test -s "$proof/structure-d2.svg"
          test -s "$proof/golden-d2.svg"

  pin-check:
    name: Pin GitHub Actions and release tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require deterministic pins
        run: bash .github/scripts/check-pins.sh

  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        run: sudo bash .github/scripts/install-syft.sh /usr/local/bin

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check

      - name: Build snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish

      - name: Prepare SBOM inventory
        run: go run ./cmd/release-artifacts prepare --dist dist --syft syft

      - name: Verify 13 artefacts
        run: go run ./cmd/release-artifacts verify --dist dist

      - name: Smoke Linux amd64 binary
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xzf dist/dirloom_Linux_x86_64.tar.gz -C "$work"
          "$work/dirloom" --version
          "$work/dirloom" completion bash >/dev/null

