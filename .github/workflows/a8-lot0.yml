# Temporary workflow for v0.4.0-a8 LOT 0 (platform facts). It runs the
# throwaway spike in spikes/a8-watch on the three CI operating systems and is
# removed, with the spike, in the commit that closes LOT 0.
name: A8 LOT 0 facts

on:
  push:
    branches: [feat/v0.4.0-a8-watch]
    paths:
      - "spikes/a8-watch/**"
      - ".github/workflows/a8-lot0.yml"

permissions:
  contents: read

jobs:
  facts:
    name: Facts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.26.10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Environment
        run: |
          echo "A8_EVIDENCE=$RUNNER_TEMP/evidence.jsonl" >> "$GITHUB_ENV"
          uname -a || true
          go version
          go env GOOS GOARCH CGO_ENABLED
          (gcc --version | head -1) || echo "no gcc on PATH"
          case "$RUNNER_OS" in
            Linux) grep -H . /proc/sys/fs/inotify/*; df -T "$RUNNER_TEMP" /tmp | tail -n +1 ;;
            macOS) sw_vers; ulimit -n; sysctl kern.maxfiles kern.maxfilesperproc ;;
            Windows) cmd //c ver; echo "TEMP=$TEMP"; wmic logicaldisk get caption,drivetype,filesystem || true ;;
          esac
      - name: NFS loopback (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nfs-kernel-server
          sudo mkdir -p /srv/a8nfs /mnt/a8nfs
          sudo chmod 777 /srv/a8nfs
          echo "/srv/a8nfs 127.0.0.1(rw,sync,no_subtree_check,no_root_squash,insecure)" | sudo tee /etc/exports
          sudo exportfs -ra
          sudo systemctl restart nfs-kernel-server
          sudo mount -t nfs -o vers=4 127.0.0.1:/srv/a8nfs /mnt/a8nfs
          sudo chmod 777 /mnt/a8nfs
          echo "A8_NFS_MOUNT=/mnt/a8nfs" >> "$GITHUB_ENV"
          echo "A8_NFS_EXPORT=/srv/a8nfs" >> "$GITHUB_ENV"
      - name: Facts
        working-directory: spikes/a8-watch
        env:
          A8_SUDO: ${{ runner.os == 'Linux' && '1' || '' }}
        run: go test -v -count=1 -timeout 70m ./facts/ 2>&1 | tee "$RUNNER_TEMP/facts.log"
      - name: Watch limit (Linux, F5)
        if: always() && runner.os == 'Linux'
        working-directory: spikes/a8-watch
        run: |
          old="$(cat /proc/sys/fs/inotify/max_user_watches)"
          sudo sysctl -w fs.inotify.max_user_watches=512
          A8_LOW_WATCHES=1 go test -v -count=1 -run 'TestF5WatchLimit' ./facts/ || true
          sudo sysctl -w fs.inotify.max_user_watches="$old"
      - name: Race detector (F10)
        id: race
        if: always()
        continue-on-error: true
        working-directory: spikes/a8-watch
        run: CGO_ENABLED=1 go test -race -count=1 -run 'TestRaceProbe|TestF11Calls' ./facts/
      - name: Record race outcome
        if: always()
        run: |
          printf '{"fact":"F10","os":"%s","verdict":"%s","detail":"go test -race (CGO_ENABLED=1) outcome: %s"}\n' \
            "$(go env GOOS)" "${{ steps.race.outcome == 'success' && 'TRUE' || 'FALSE' }}" "${{ steps.race.outcome }}" >> "$A8_EVIDENCE"
      - name: Summary
        if: always()
        working-directory: spikes/a8-watch
        run: |
          {
            echo "## A8 LOT 0 facts — $RUNNER_OS"
            echo
            go run ./cmd/summary "$A8_EVIDENCE"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "----- evidence -----"
          cat "$A8_EVIDENCE" || true
