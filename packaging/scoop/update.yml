name: Update manifest

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-dirloom-manifest
  cancel-in-progress: false

jobs:
  update:
    name: Open version PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out bucket
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build an idempotent version branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # BEGIN semver.sh
          _SEMVER_DIGITS='0123456789'
          _SEMVER_LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'

          # semver_valid VERSION: succeeds when VERSION is a SemVer 2.0.0 version.
          semver_valid() {
            local d="$_SEMVER_DIGITS" l="$_SEMVER_LETTERS"
            local num="(0|[123456789][$d]*)"
            local pre="(0|[123456789][$d]*|[$d]*[$l-][$d$l-]*)"
            local build="[$d$l-]+"
            local re="^$num\\.$num\\.$num(-$pre(\\.$pre)*)?(\\+$build(\\.$build)*)?\$"
            [[ "$1" =~ $re ]]
          }

          # The helpers below set _semver_cmp to -1, 0 or 1 instead of printing it, so
          # that a comparison starts no subshell.

          # _semver_ascii_cmp A B: compares character codes.
          _semver_ascii_cmp() {
            local a="$1" b="$2" i ca cb
            for ((i = 0; i < ${#a} && i < ${#b}; i++)); do
              if [[ "${a:i:1}" != "${b:i:1}" ]]; then
                printf -v ca '%d' "'${a:i:1}"
                printf -v cb '%d' "'${b:i:1}"
                if ((ca < cb)); then _semver_cmp=-1; else _semver_cmp=1; fi
                return 0
              fi
            done
            if ((${#a} < ${#b})); then
              _semver_cmp=-1
            elif ((${#a} > ${#b})); then
              _semver_cmp=1
            else
              _semver_cmp=0
            fi
          }

          # _semver_num_cmp A B: compares two numbers without leading zeros, of any
          # length.
          _semver_num_cmp() {
            if ((${#1} < ${#2})); then
              _semver_cmp=-1
            elif ((${#1} > ${#2})); then
              _semver_cmp=1
            else
              _semver_ascii_cmp "$1" "$2"
            fi
          }

          _semver_is_num() {
            [[ -n "$1" && "$1" != *[!0123456789]* ]]
          }

          # _semver_precedence A B: compares two valid versions.
          _semver_precedence() {
            local a="${1%%+*}" b="${2%%+*}"
            local a_pre="" b_pre="" i n
            local -a a_ids b_ids
            if [[ "$a" == *-* ]]; then a_pre="${a#*-}"; fi
            if [[ "$b" == *-* ]]; then b_pre="${b#*-}"; fi
            IFS=. read -r -a a_ids <<<"${a%%-*}"
            IFS=. read -r -a b_ids <<<"${b%%-*}"
            for i in 0 1 2; do
              _semver_num_cmp "${a_ids[i]}" "${b_ids[i]}"
              if [[ "$_semver_cmp" != 0 ]]; then return 0; fi
            done
            # A version without a pre-release follows the same version with one.
            if [[ -z "$a_pre" && -z "$b_pre" ]]; then
              _semver_cmp=0
              return 0
            elif [[ -z "$a_pre" ]]; then
              _semver_cmp=1
              return 0
            elif [[ -z "$b_pre" ]]; then
              _semver_cmp=-1
              return 0
            fi
            IFS=. read -r -a a_ids <<<"$a_pre"
            IFS=. read -r -a b_ids <<<"$b_pre"
            n=${#a_ids[@]}
            if ((${#b_ids[@]} < n)); then n=${#b_ids[@]}; fi
            for ((i = 0; i < n; i++)); do
              if _semver_is_num "${a_ids[i]}" && _semver_is_num "${b_ids[i]}"; then
                _semver_num_cmp "${a_ids[i]}" "${b_ids[i]}"
              elif _semver_is_num "${a_ids[i]}"; then
                _semver_cmp=-1 # numeric identifiers precede alphanumeric ones
              elif _semver_is_num "${b_ids[i]}"; then
                _semver_cmp=1
              else
                _semver_ascii_cmp "${a_ids[i]}" "${b_ids[i]}"
              fi
              if [[ "$_semver_cmp" != 0 ]]; then return 0; fi
            done
            # Equal so far: the longer list of identifiers follows.
            _semver_num_cmp "${#a_ids[@]}" "${#b_ids[@]}"
          }

          # semver_compare A B: prints -1, 0 or 1 when A has lower, equal or higher
          # precedence than B. Build metadata is ignored. Returns 2 when A or B is not a
          # SemVer 2.0.0 version.
          semver_compare() {
            local v
            for v in "$1" "$2"; do
              if ! semver_valid "$v"; then
                echo "not a SemVer 2.0.0 version: '${v}'" >&2
                return 2
              fi
            done
            _semver_precedence "$1" "$2"
            echo "$_semver_cmp"
          }

          # semver_update_decision CURRENT NEW: prints the decision of a package updater
          # whose manifest is at CURRENT (empty when there is no manifest yet) and that
          # is asked to move to NEW:
          #   same       CURRENT and NEW are the same text: nothing to do;
          #   newer      NEW has higher precedence than CURRENT, or there is no CURRENT;
          #   not-newer  NEW has lower or equal precedence: the updater must refuse.
          # Returns 2 when CURRENT or NEW is not a SemVer 2.0.0 version.
          semver_update_decision() {
            if [[ -n "$1" ]] && ! semver_valid "$1"; then
              echo "not a SemVer 2.0.0 version: '${1}'" >&2
              return 2
            fi
            if ! semver_valid "$2"; then
              echo "not a SemVer 2.0.0 version: '${2}'" >&2
              return 2
            fi
            if [[ -z "$1" ]]; then
              echo newer
            elif [[ "$1" == "$2" ]]; then
              echo same
            else
              _semver_precedence "$1" "$2"
              if [[ "$_semver_cmp" == -1 ]]; then echo newer; else echo not-newer; fi
            fi
          }
          # END semver.sh
          payload="$(gh api repos/dirloom/dirloom/releases/latest)"
          draft="$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["draft"])')"
          prerelease="$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["prerelease"])')"
          if [[ "$draft" != "False" || "$prerelease" != "False" ]]; then
            echo "Latest GitHub Release is not a published stable release."
            exit 1
          fi
          TAG="$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          VERSION="${TAG#v}"
          work="$(mktemp -d)"
          gh release download "$TAG" --repo dirloom/dirloom --pattern checksums.txt --dir "$work"
          gh release download "$TAG" --repo dirloom/dirloom --pattern dirloom_Windows_x86_64.zip --dir "$work"
          gh release download "$TAG" --repo dirloom/dirloom --pattern dirloom_Windows_arm64.zip --dir "$work"
          checksum_hash() { awk -v name="$1" '$2==name{print $1}' "$work/checksums.txt"; }
          win_x64="$(checksum_hash dirloom_Windows_x86_64.zip)"
          win_arm="$(checksum_hash dirloom_Windows_arm64.zip)"
          test -n "$win_x64" && test -n "$win_arm"
          actual_x64="$(sha256sum "$work/dirloom_Windows_x86_64.zip" | awk '{print $1}')"
          actual_arm="$(sha256sum "$work/dirloom_Windows_arm64.zip" | awk '{print $1}')"
          test "$actual_x64" = "$win_x64"
          test "$actual_arm" = "$win_arm"
          unzip -l "$work/dirloom_Windows_x86_64.zip" | grep -q 'dirloom.exe'
          unzip -l "$work/dirloom_Windows_arm64.zip" | grep -q 'dirloom.exe'
          branch="dirloom-${VERSION}"
          count="$(gh pr list --head "$branch" --state open --json number --jq 'length')"
          if [[ "${count:-0}" -ge 1 ]]; then
            echo "Scoop PR already open for ${VERSION}"
            exit 0
          fi
          git checkout -B "$branch"
          current="$(python3 -c 'import json; print(json.load(open("dirloom.json")).get("version",""))')"
          # SemVer 2.0.0 precedence, not `sort -V`: 0.4.0 follows 0.4.0-rc1.
          decision="$(semver_update_decision "$current" "$VERSION")"
          case "$decision" in
          same)
            echo "Scoop manifest already at ${VERSION}"
            exit 0
            ;;
          newer) ;;
          *)
            echo "Refusing to move Scoop from ${current} to ${VERSION}: not a newer SemVer version"
            exit 1
            ;;
          esac
          python3 - <<PY
          from pathlib import Path
          import json
          manifest = json.loads(Path("dirloom.json").read_text(encoding="utf-8"))
          manifest["version"] = "${VERSION}"
          manifest["architecture"]["64bit"]["url"] = "https://github.com/dirloom/dirloom/releases/download/${TAG}/dirloom_Windows_x86_64.zip"
          manifest["architecture"]["64bit"]["hash"] = "${win_x64}"
          manifest["architecture"]["arm64"]["url"] = "https://github.com/dirloom/dirloom/releases/download/${TAG}/dirloom_Windows_arm64.zip"
          manifest["architecture"]["arm64"]["hash"] = "${win_arm}"
          Path("dirloom.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          git add dirloom.json
          if git diff --cached --quiet; then
            echo "Scoop manifest already at ${VERSION}"
            exit 0
          fi
          git -c user.name="dirloom-package-mgr" -c user.email="330109029+dirloom-package-mgr@users.noreply.github.com" commit -m "chore: update Dirloom to ${VERSION}"
          git push -u origin "$branch"
          gh pr create --head "$branch" --title "dirloom ${VERSION}" --body "Update Scoop to GitHub Release ${TAG}. Hashes were recalculated independently from checksums.txt. Do not merge without the Validate manifests check."
