name: Update cask

# Recovery-only. The official Homebrew publisher is
# dirloom/dirloom `.github/workflows/update-packages.yml` on a published
# release (or its workflow_dispatch). Do not add a timed trigger: a second
# writer collides on branch dirloom-<version>.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional Dirloom GitHub release tag. Empty selects the latest stable release.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-dirloom-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Open a version PR via the official Dirloom publisher
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_BOT_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "PACKAGE_BOT_TOKEN is required on dirloom/homebrew-tap for recovery."
            echo "Prefer workflow_dispatch on dirloom/dirloom Update package managers."
            exit 1
          fi
          git clone --depth 1 https://github.com/dirloom/dirloom.git /tmp/dirloom
          if [[ -n "${REQUESTED_TAG}" ]]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="$(gh release view --repo dirloom/dirloom --json isDraft,isPrerelease,tagName --jq 'select((.isDraft|not) and (.isPrerelease|not)) | .tagName')"
          fi
          export TAG
          bash /tmp/dirloom/.github/scripts/update-homebrew.sh
